<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assessment — meor</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/meor-favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ─────────────────────────────────────────────────── */
:root {
  --bg:        #F9F9F8;
  --surface:   #FFFFFF;
  --ink:       #0F0F0F;
  --ink-2:     #4A4A4A;
  --ink-3:     #909090;
  --border:    #E5E5E5;
  --border-2:  #D0D0D0;
  --green:     #18794E;
  --green-bg:  #EDFBF1;
  --green-mid: #86EFAC;
  --r-sm:      8px;
  --r-lg:      12px;
  --font:      'Inter', system-ui, -apple-system, sans-serif;
  --font-ar:   'Noto Sans Arabic', system-ui, sans-serif;
  --ease:      200ms ease;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}
html[lang="ar"] body { font-family: var(--font-ar); }
a { color: inherit; text-decoration: none; }
button { cursor: pointer; font-family: inherit; }
.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

/* ── TOP BAR ─────────────────────────────────────────────────── */
.top-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px 0;
  position: sticky;
  top: 0;
  z-index: 10;
}
.top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.brand {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.03em;
  color: var(--ink);
  line-height: 1;
}
.brand-dot { color: var(--green); }
.lang-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-2);
  transition: border-color var(--ease), color var(--ease);
  min-height: 32px;
  font-family: inherit;
}
.lang-btn:hover { border-color: var(--green); color: var(--green); }
.progress-track {
  height: 2px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--green);
  border-radius: 2px;
  transition: width 300ms ease;
}
.step-label {
  font-size: 12px;
  color: var(--ink-3);
  padding: 8px 0 12px;
  font-variant-numeric: tabular-nums;
}

/* ── MAIN ────────────────────────────────────────────────────── */
main {
  flex: 1;
  display: flex;
  justify-content: center;
  padding: 48px 24px 120px;
}
.step-wrap {
  width: 100%;
  max-width: 640px;
}
#step-content { outline: none; }

/* ── STEP HEADER ─────────────────────────────────────────────── */
.step-header { margin-bottom: 32px; }
.step-title {
  font-size: clamp(22px, 4vw, 30px);
  font-weight: 600;
  letter-spacing: -0.025em;
  line-height: 1.25;
  margin-bottom: 10px;
}
.step-sub {
  font-size: 15px;
  color: var(--ink-2);
  line-height: 1.6;
}

/* ── OPTION CARDS (industry, scale, budget, timeline) ─────────── */
.options { display: flex; flex-direction: column; gap: 10px; }
.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.opt-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r-lg);
  padding: 16px 18px;
  cursor: pointer;
  transition: border-color var(--ease), background var(--ease);
  display: flex;
  align-items: flex-start;
  gap: 12px;
  text-align: start;
  min-height: 44px;
  width: 100%;
  font-family: inherit;
}
.opt-card:hover { border-color: var(--border-2); }
.opt-card.selected {
  border-color: var(--green);
  background: var(--green-bg);
}
.opt-check {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 1.5px solid var(--border-2);
  flex-shrink: 0;
  margin-top: 2px;
  transition: border-color var(--ease), background var(--ease);
  display: flex;
  align-items: center;
  justify-content: center;
}
.opt-card.selected .opt-check {
  border-color: var(--green);
  background: var(--green);
}
.opt-check-icon {
  display: none;
  width: 10px;
  height: 10px;
}
.opt-card.selected .opt-check-icon { display: block; }
.opt-body { flex: 1; }
.opt-name {
  font-size: 15px;
  font-weight: 500;
  line-height: 1.3;
  color: var(--ink);
}
.opt-desc {
  font-size: 13px;
  color: var(--ink-3);
  margin-top: 3px;
  line-height: 1.4;
}
/* Scale options in a row */
.options-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
}
/* Single-line option cards (budget, timeline) */
.opt-card.compact { padding: 13px 16px; align-items: center; }

/* ── PAIN STEP ───────────────────────────────────────────────── */
.pain-textarea-wrap { margin-bottom: 28px; }
.field-label {
  display: block;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-2);
  margin-bottom: 8px;
}
.pain-textarea {
  width: 100%;
  min-height: 108px;
  padding: 14px 16px;
  border: 1.5px solid var(--border);
  border-radius: var(--r-lg);
  font-size: 15px;
  font-family: inherit;
  color: var(--ink);
  background: var(--surface);
  outline: none;
  resize: vertical;
  line-height: 1.6;
  transition: border-color var(--ease);
}
.pain-textarea:focus { border-color: var(--green); }
.pain-textarea::placeholder { color: var(--ink-3); }
.pain-divider {
  font-size: 13px;
  color: var(--ink-3);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.pain-divider::before, .pain-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}
.checkboxes { display: flex; flex-direction: column; gap: 8px; }
.chk-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  cursor: pointer;
  background: var(--surface);
  transition: border-color var(--ease), background var(--ease);
  text-align: start;
  font-family: inherit;
  min-height: 44px;
  width: 100%;
}
.chk-item:hover { border-color: var(--border-2); }
.chk-item.checked { border-color: var(--green); background: var(--green-bg); }
.chk-box {
  width: 18px;
  height: 18px;
  border: 1.5px solid var(--border-2);
  border-radius: 4px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color var(--ease), background var(--ease);
}
.chk-item.checked .chk-box {
  border-color: var(--green);
  background: var(--green);
}
.chk-icon { display: none; width: 11px; height: 11px; }
.chk-item.checked .chk-icon { display: block; }
.chk-text { font-size: 14px; color: var(--ink); line-height: 1.4; }

/* ── VOLUME SLIDER ───────────────────────────────────────────── */
.vol-display {
  font-size: 52px;
  font-weight: 600;
  letter-spacing: -0.04em;
  color: var(--ink);
  line-height: 1;
  margin-bottom: 4px;
}
.vol-sublabel {
  font-size: 13px;
  color: var(--ink-3);
  margin-bottom: 28px;
}
.slider-wrap { margin-bottom: 20px; }
.range-input {
  width: 100%;
  height: 6px;
  -webkit-appearance: none;
  appearance: none;
  border-radius: 3px;
  outline: none;
  cursor: pointer;
  background: linear-gradient(to right, var(--green) 0%, var(--green) var(--pct, 25%), var(--border) var(--pct, 25%), var(--border) 100%);
}
.range-input::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--green);
  box-shadow: 0 1px 4px rgba(0,0,0,0.12);
  cursor: pointer;
  transition: border-color var(--ease);
}
.range-input::-moz-range-thumb {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--green);
  cursor: pointer;
}
.range-input:focus::-webkit-slider-thumb { border-color: var(--ink); }
.range-labels {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  font-size: 12px;
  color: var(--ink-3);
}
.vol-helper {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 16px 20px;
  font-size: 14px;
  color: var(--ink-2);
  line-height: 1.6;
  min-height: 60px;
  transition: opacity var(--ease);
}

/* ── QUALIFY (2 question groups) ─────────────────────────────── */
.qualify-group { margin-bottom: 32px; }
.qualify-label {
  font-size: 15px;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 12px;
  line-height: 1.4;
}

/* ── INSIGHT CARD ────────────────────────────────────────────── */
.insight-card {
  background: var(--green-bg);
  border: 1px solid #A7F3C0;
  border-radius: var(--r-lg);
  padding: 24px 24px 20px;
  margin-bottom: 36px;
}
.insight-tag {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--green);
  margin-bottom: 10px;
}
.insight-headline {
  font-size: 17px;
  font-weight: 600;
  line-height: 1.4;
  color: var(--ink);
  margin-bottom: 10px;
  letter-spacing: -0.01em;
}
.insight-body {
  font-size: 14px;
  color: var(--ink-2);
  line-height: 1.7;
}

/* ── CONTACT FORM ────────────────────────────────────────────── */
.contact-title {
  font-size: 17px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 20px;
  letter-spacing: -0.01em;
}
.field-group { margin-bottom: 16px; }
.field-input {
  width: 100%;
  height: 48px;
  padding: 0 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  font-size: 15px;
  font-family: inherit;
  color: var(--ink);
  background: var(--surface);
  outline: none;
  transition: border-color var(--ease);
  min-height: 44px;
}
.field-input:focus { border-color: var(--green); }
.field-input::placeholder { color: var(--ink-3); }
.field-input.invalid { border-color: #E53E3E; }
.field-textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  font-size: 15px;
  font-family: inherit;
  color: var(--ink);
  background: var(--surface);
  outline: none;
  resize: vertical;
  min-height: 88px;
  line-height: 1.6;
  transition: border-color var(--ease);
}
.field-textarea:focus { border-color: var(--green); }
.field-textarea::placeholder { color: var(--ink-3); }
.submit-error {
  font-size: 14px;
  color: #E53E3E;
  margin-top: 10px;
  display: none;
}

/* ── DONE STATE ──────────────────────────────────────────────── */
.done-wrap {
  text-align: center;
  padding: 48px 0;
}
.done-icon {
  width: 52px;
  height: 52px;
  background: var(--green-bg);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 24px;
  color: var(--green);
}
.done-icon svg { width: 26px; height: 26px; }
.done-title {
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.025em;
  margin-bottom: 14px;
}
.done-body {
  font-size: 16px;
  color: var(--ink-2);
  line-height: 1.7;
  max-width: 480px;
  margin: 0 auto 20px;
}
.done-ref {
  display: inline-block;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-3);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 6px 14px;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
}

/* ── FOOTER BAR ──────────────────────────────────────────────── */
.foot-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  z-index: 10;
}
.foot-back {
  background: none;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 10px 18px;
  font-size: 15px;
  font-weight: 500;
  color: var(--ink-2);
  transition: border-color var(--ease), color var(--ease);
  min-height: 44px;
  font-family: inherit;
  display: flex;
  align-items: center;
  gap: 6px;
}
.foot-back:hover { border-color: var(--border-2); color: var(--ink); }
.foot-back svg { width: 14px; height: 14px; }
.foot-back.hidden { visibility: hidden; pointer-events: none; }
.foot-time {
  font-size: 13px;
  color: var(--ink-3);
  flex: 1;
  text-align: center;
}
.foot-cont {
  background: var(--green);
  color: #fff;
  border: none;
  border-radius: var(--r-sm);
  padding: 10px 22px;
  font-size: 15px;
  font-weight: 500;
  font-family: inherit;
  min-height: 44px;
  transition: opacity var(--ease);
}
.foot-cont:disabled { opacity: 0.38; cursor: not-allowed; }
.foot-cont:not(:disabled):hover { opacity: 0.88; }

/* ── RESPONSIVE ──────────────────────────────────────────────── */
@media (max-width: 540px) {
  .top-bar { padding: 12px 16px 0; }
  main { padding: 32px 16px 100px; }
  .step-title { font-size: 22px; }
  .options-grid { grid-template-columns: 1fr; }
  .options-row { grid-template-columns: 1fr; }
  .foot-bar { padding: 12px 16px; }
  .foot-time { display: none; }
  .vol-display { font-size: 42px; }
  .insight-card { padding: 20px; }
}
</style>
</head>

<!-- TOP BAR -->
<header class="top-bar" role="banner">
  <div class="top-row">
    <a href="/" class="brand" aria-label="Back to meor home">meor<span class="brand-dot">.</span></a>

<main>

<!-- FOOTER BAR -->
<div class="foot-bar" id="foot-bar" role="navigation" aria-label="Step navigation">
  <button class="foot-back hidden" id="back-btn" aria-label="Go back">

    <span id="cont-label">Continue</span>
  </button>
</div>

/* ─────────────────────────────────────────────────────────────────────
   STEP SEQUENCE
───────────────────────────────────────────────────────────────────── */
function getSeq() {
  return state.industry === 'factory'
    ? [S.INDUSTRY, S.SCALE, S.PAIN, S.VOLUME, S.QUALIFY, S.CONTACT]
    : [S.INDUSTRY, S.PAIN, S.VOLUME, S.QUALIFY, S.CONTACT];
}
function totalSteps() { return getSeq().length; }
function curStep()    { return getSeq()[stepIdx]; }
function dispStep()   { return stepIdx + 1; }

/* ─────────────────────────────────────────────────────────────────────
   VALIDATION
───────────────────────────────────────────────────────────────────── */
function isValid() {
  switch (curStep()) {
    case S.INDUSTRY: return !!state.industry;
    case S.SCALE:    return !!state.scale;
    case S.PAIN:     return state.painText.trim().length > 0 || state.pains.length > 0;
    case S.VOLUME:   return true;
    case S.QUALIFY:  return !!state.budget && !!state.timeline;
    case S.CONTACT:  return state.name.trim() && state.business.trim() && state.whatsapp.trim().length >= 6;
  }
  return false;
}

/* ─────────────────────────────────────────────────────────────────────
   RENDER
───────────────────────────────────────────────────────────────────── */
function render() {
  if (isDone) return;
  const c = T[lang];
  const total = totalSteps();
  const disp  = dispStep();
  const pct   = (disp / total) * 100;

  /* progress */
  document.getElementById('progress-fill').style.width = pct + '%';
  const pb = document.querySelector('.progress-track');
  pb.setAttribute('aria-valuenow', disp);
  pb.setAttribute('aria-valuemax', total);
  pb.setAttribute('aria-label', c.stepOf(disp, total));
  document.getElementById('step-label').textContent = c.stepOf(disp, total);

  /* lang button */
  document.getElementById('lang-btn').textContent = c.langBtn;

  /* step content */
  const el = document.getElementById('step-content');
  el.innerHTML = buildStepHTML(curStep());
  wireStep(curStep());

  /* footer */
  document.getElementById('back-label').textContent = c.back;
  document.getElementById('foot-time').textContent  = c.timeEst;
  const contLabel = curStep() === S.CONTACT ? c.getInsight : c.continue;
  document.getElementById('cont-label').textContent = contLabel;
  document.getElementById('cont-btn').disabled = !isValid();
  const backBtn = document.getElementById('back-btn');
  backBtn.classList.toggle('hidden', stepIdx === 0);
  backBtn.setAttribute('aria-hidden', stepIdx === 0);

  /* focus step content for screen readers */
  el.focus({ preventScroll: true });
}

/* ─────────────────────────────────────────────────────────────────────
   BUILD STEP HTML
───────────────────────────────────────────────────────────────────── */
function buildStepHTML(step) {
  const c = T[lang];
  switch (step) {
    case S.INDUSTRY: return buildIndustryHTML(c);
    case S.SCALE:    return buildScaleHTML(c);
    case S.PAIN:     return buildPainHTML(c);
    case S.VOLUME:   return buildVolumeHTML(c);
    case S.QUALIFY:  return buildQualifyHTML(c);
    case S.CONTACT:  return buildContactHTML(c);
  }
  return '';
}

function optCardHTML(item, selected, showDesc) {
  const sel = selected ? 'selected' : '';
  const desc = showDesc && item.desc ? `<div class="opt-desc">${item.desc}</div>` : '';
  return `
    <button class="opt-card ${sel}" data-id="${item.id}" aria-pressed="${!!selected}">
      <div class="opt-check" aria-hidden="true">
        <svg class="opt-check-icon" viewBox="0 0 12 10" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="1 5 4 8 11 1"/>
        </svg>
      </div>
      <div class="opt-body">
        <div class="opt-name">${item.name}</div>
        ${desc}
      </div>
    </button>`;
}

    const checked = state.pains.includes(i);
    return `<button class="chk-item ${checked ? 'checked' : ''}" data-idx="${i}" aria-pressed="${checked}">

/* ─────────────────────────────────────────────────────────────────────
   WIRE STEP (event listeners + state restore)
───────────────────────────────────────────────────────────────────── */
function wireStep(step) {
  switch (step) {
    case S.INDUSTRY: wireIndustry(); break;
    case S.SCALE:    wireScale();    break;
    case S.PAIN:     wirePain();     break;
    case S.VOLUME:   wireVolume();   break;
    case S.QUALIFY:  wireQualify();  break;
    case S.CONTACT:  wireContact();  break;
  }
}

function wireIndustry() {
  document.querySelectorAll('[data-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      const prev = state.industry;
      state.industry = btn.dataset.id;
      if (prev !== state.industry) { state.scale = null; state.pains = []; state.painText = ''; }
      render();
    });
    btn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); btn.click(); } });
  });
}

function wireScale() {
  document.querySelectorAll('[data-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      const prev = state.scale;
      state.scale = btn.dataset.id;
      if (prev !== state.scale) state.pains = [];
      render();
    });
  });
}

function wirePain() {
  const ta = document.getElementById('pain-text');
  ta.addEventListener('input', () => {
    state.painText = ta.value;
    syncContBtn();
  });
  document.querySelectorAll('.chk-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.idx);
      const pos = state.pains.indexOf(idx);
      if (pos === -1) state.pains.push(idx);
      else state.pains.splice(pos, 1);
      btn.classList.toggle('checked', state.pains.includes(idx));
      btn.setAttribute('aria-pressed', state.pains.includes(idx));
      const chk = btn.querySelector('.chk-box');
      chk.style.background = state.pains.includes(idx) ? 'var(--green)' : '';
      chk.style.borderColor = state.pains.includes(idx) ? 'var(--green)' : '';
      syncContBtn();
    });
  });
}

function wireVolume() {
  const slider = document.getElementById('vol-slider');
  const c = T[lang];
  function update() {
    state.volume = parseInt(slider.value);
    const pct    = (state.volume / 200) * 100;
    const disp   = state.volume >= 200 ? '200+' : String(state.volume);
    slider.style.setProperty('--pct', pct + '%');
    slider.setAttribute('aria-valuenow', state.volume);
    slider.setAttribute('aria-valuetext', disp);
    document.getElementById('vol-display').textContent = disp;
    const helper = c.helpers.find(h => state.volume < h.max) || c.helpers[c.helpers.length - 1];
    document.getElementById('vol-helper').textContent = helper.text;
  }
  slider.addEventListener('input', update);
  slider.addEventListener('keydown', e => {
    if (['ArrowLeft','ArrowDown'].includes(e.key)) { e.preventDefault(); slider.value = Math.max(0, parseInt(slider.value) - 5); update(); }
    if (['ArrowRight','ArrowUp'].includes(e.key))  { e.preventDefault(); slider.value = Math.min(200, parseInt(slider.value) + 5); update(); }
  });
}

function wireQualify() {
  document.querySelectorAll('[data-budget]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.budget = btn.dataset.budget;
      document.querySelectorAll('[data-budget]').forEach(b => {
        const sel = b.dataset.budget === state.budget;
        b.classList.toggle('selected', sel);
        b.setAttribute('aria-pressed', sel);
      });
      syncContBtn();
    });
  });
  document.querySelectorAll('[data-timeline]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.timeline = btn.dataset.timeline;
      document.querySelectorAll('[data-timeline]').forEach(b => {
        const sel = b.dataset.timeline === state.timeline;
        b.classList.toggle('selected', sel);
        b.setAttribute('aria-pressed', sel);
      });
      syncContBtn();
    });
  });
}

function wireContact() {
  const bind = (id, key) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('input', () => { state[key] = el.value; syncContBtn(); });
  };
  bind('f-name', 'name'); bind('f-biz', 'business'); bind('f-wa', 'whatsapp'); bind('f-notes', 'notes');
}

function syncContBtn() {
  document.getElementById('cont-btn').disabled = !isValid();
}

/* ─────────────────────────────────────────────────────────────────────
   INSIGHT GENERATION
───────────────────────────────────────────────────────────────────── */
function buildInsight(l) {
  const v      = state.volume;
  const pc     = state.pains.length;
  const hasText = state.painText.trim().length > 0;
  const LIMIT  = 140;

  function trunc(s) {
    s = s.trim();
    return s.length <= LIMIT ? s : s.substring(0, LIMIT).trimEnd() + '…';
  }

  if (l === 'en') {
    const c  = T.en;
    const pre = hasText ? `You told us: “${trunc(state.painText)}” — that’s the kind of detail we build around. ` : '';
    const iname = c.indNames[state.industry] || 'business';
    if (v < 25) return {
      headline: `For a ${iname} at your volume, the highest-leverage move is consistency, not scale.`,
      body: pre + (pc > 0 ? `You also flagged ${pc} common pattern${pc > 1 ? 's' : ''}. ` : '') + 'The right approach is a focused agent that handles the top 1–2 issues reliably, not a broad system. We would typically explore a single-purpose solution that pays for itself within 60 days.'
    };
    if (v < 75) return {
      headline: 'Your situation is exactly where we see the strongest ROI for businesses like yours.',
      body: pre + (pc > 0 ? `Combined with the ${pc} pattern${pc > 1 ? 's' : ''} you flagged and your daily volume, ` : 'Your daily volume ') + 'puts you in the range where automation typically saves 15–25 hours per week of staff time. Most clients in this band recover their setup cost within 30–60 days.'
    };
    if (v < 150) return {
      headline: 'You are operating beyond what manual handling can sustain. This is urgent.',
      body: pre + 'At your volume' + (pc > 0 ? ` across ${pc} area${pc > 1 ? 's' : ''}` : '') + ', you are almost certainly losing leads or customers weekly to slow response times. The right system here pays back in weeks, not months — but the wrong system makes things worse. We will need to scope carefully.'
    };
    return {
      headline: 'Your volume puts you in territory where most off-the-shelf tools break.',
      body: pre + 'At this scale' + (pc > 0 ? ` with ${pc} pain area${pc > 1 ? 's' : ''}` : '') + ', the solution has to be properly architected — not a no-code chatbot. We work with businesses at this scale carefully and won’t quote until we have understood your operations in depth.'
    };
  } else {
    const pre = hasText ? `أخبرتنا: «${trunc(state.painText)}» — هذا النوع من التفاصيل الذي نبني عليه. ` : '';
    if (v < 25) return {
      headline: 'بحجم عملك الحالي، الخطوة الأكثر فاعلية هي الاتساق، وليس الحجم.',
      body: pre + (pc > 0 ? `أشرت أيضاً إلى ${pc} نمط شائع. ` : '') + 'النهج الصحيح هو وكيل ذكي مركّز على أهم 1–2 من المشكلات بشكل موثوق، وليس نظاماً شاملاً. عادةً نبحث في حل أحادي الغرض يسترد تكلفته خلال 60 يوماً.'
    };
    if (v < 75) return {
      headline: 'وضعك بالضبط حيث نرى أعلى عائد على الاستثمار للأعمال المشابهة.',
      body: pre + (pc > 0 ? `مع ${pc} نمط أشرت إليه و` : '') + 'حجم رسائلك اليومي يضعك في النطاق الذي توفر فيه الأتمتة 15–25 ساعة أسبوعياً. معظم عملائنا في هذا النطاق يستردون تكلفة الإعداد خلال 30–60 يوماً.'
    };
    if (v < 150) return {
      headline: 'أنت تعمل بحجم تجاوز ما يمكن للمعالجة اليدوية إدارته. الأمر عاجل.',
      body: pre + 'بحجمك' + (pc > 0 ? ` عبر ${pc} نقطة ألم` : '') + '، أنت بالتأكيد تخسر عملاء أسبوعياً بسبب بطء الاستجابة. النظام الصحيح هنا يسترد تكلفته خلال أسابيع — والخاطئ يفاقم المشكلة. نحتاج لتحديد النطاق بعناية.'
    };
    return {
      headline: 'حجم عملك في نطاق تنهار فيه معظم الأدوات الجاهزة.',
      body: pre + 'بهذا الحجم' + (pc > 0 ? ` مع ${pc} نقطة ألم` : '') + '، الحل يجب أن يُصمّم معمارياً بشكل صحيح — وليس روبوت no-code. نتعامل مع أعمال بهذا الحجم بحذر ولن نقدّم عرض سعر قبل فهم عملياتك بعمق.'
    };
  }
}

/* ─────────────────────────────────────────────────────────────────────
   NAVIGATION
───────────────────────────────────────────────────────────────────── */
document.getElementById('cont-btn').addEventListener('click', () => {
  if (curStep() === S.CONTACT) { submitForm(); return; }
  stepIdx = Math.min(stepIdx + 1, getSeq().length - 1);
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
document.getElementById('back-btn').addEventListener('click', () => {
  if (stepIdx > 0) { stepIdx--; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
});

/* ─────────────────────────────────────────────────────────────────────
   LANGUAGE TOGGLE
───────────────────────────────────────────────────────────────────── */
document.getElementById('lang-btn').addEventListener('click', () => {
  lang = lang === 'en' ? 'ar' : 'en';
  localStorage.setItem('meor_lang', lang);
  document.documentElement.lang = lang;
  document.documentElement.dir  = lang === 'ar' ? 'rtl' : 'ltr';
  render();
});

/* ─────────────────────────────────────────────────────────────────────
   FORM SUBMISSION
───────────────────────────────────────────────────────────────────── */
async function submitForm() {
  const btn = document.getElementById('cont-btn');
  const c   = T[lang];
  btn.disabled = true;
  document.getElementById('cont-label').textContent = c.sending;

  try {
    const res = await fetch(SUBMIT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...state, language: lang })
    });
    const data = await res.json();
    if (data.ok) {
      showDone(data.ref);
    } else {
      throw new Error(data.error || 'Unknown error');
    }
  } catch (err) {
    btn.disabled = false;
    document.getElementById('cont-label').textContent = c.getInsight;
    const errEl = document.getElementById('submit-error');
    if (errEl) { errEl.textContent = c.submitErr; errEl.style.display = 'block'; }
  }
}

function showDone(ref) {
  isDone = true;
  const c = T[lang];

  /* hide footer bar */
  document.getElementById('foot-bar').style.display = 'none';

  /* hide progress / step label */
  document.querySelector('.progress-track').style.display = 'none';
  document.getElementById('step-label').style.display = 'none';

  document.getElementById('step-content').innerHTML = `
    <div class="done-wrap" role="status" aria-live="polite">
      <div class="done-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <h2 class="done-title">${c.doneTitle}</h2>
      <p class="done-body">${c.doneBody}</p>
      <span class="done-ref">${ref}</span>
    </div>`;
}

/* ─────────────────────────────────────────────────────────────────────
   INIT
───────────────────────────────────────────────────────────────────── */
document.documentElement.lang = lang;
document.documentElement.dir  = lang === 'ar' ? 'rtl' : 'ltr';
render();
</script>
